name: doompedia

services:
  doompedia-web:
    image: caddy:2-alpine
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    expose:
      - "${DOOMPEDIA_INTERNAL_PORT:-8080}"
    volumes:
      - type: bind
        source: "${DOOMPEDIA_CONTENT_DIR:?DOOMPEDIA_CONTENT_DIR must reference a verified content tree}"
        target: /srv
        read_only: true
        bind:
          create_host_path: false
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=32m,mode=1777
      - /config:size=16m,mode=0700,uid=10001,gid=10001
      - /data:size=16m,mode=0700,uid=10001,gid=10001
    pids_limit: 128
    mem_limit: "${DOOMPEDIA_MEMORY_LIMIT:-256m}"
    logging:
      driver: json-file
      options:
        max-size: "25m"
        max-file: "3"
    networks:
      - web

networks:
  web:
    external: true
