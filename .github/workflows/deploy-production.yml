name: Deploy Doompedia Production

on:
  workflow_run:
    workflows: ["doompedia-ci"]
    types: [completed]
    branches: [main]

permissions:
  actions: read
  contents: read
  id-token: write

jobs:
  release:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    uses: mahmoudelfeelig/HetznerReleaseGateway/.github/workflows/release.yml@1d0be0bb3b6ac26ce749e382081d320855d5bcba
    with:
      app: doompedia
      source_sha: ${{ github.event.workflow_run.head_sha }}
      ci_run_id: ${{ github.event.workflow_run.id }}
